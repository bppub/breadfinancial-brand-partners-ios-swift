name: CI

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}-ci-pipeline
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Format, lint, and build
    runs-on: macos-26
    env:
      SOURCE_PACKAGES_DIR: .spm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install swift-format and SwiftLint
        run: brew install swift-format swiftlint

      # Keep these checks first: failures stop the job before build/test work.
      - name: Check Swift formatting
        run: Scripts/format.sh --check

      - name: Run SwiftLint
        run: Scripts/lint.sh

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run macOS Tests
        run: |
          xcodebuild test \
            -workspace BreadPartners.xcworkspace \
            -scheme BreadPartnersCoreTests \
            -testPlan BreadPartnersMacTests \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resultBundlePath MacTestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS Simulator Tests
        run: |
          xcodebuild test \
            -workspace BreadPartners.xcworkspace \
            -scheme BreadPartnersSimulatorTests \
            -testPlan BreadPartnersSimulatorTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4.1' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resultBundlePath SimulatorTestResults.xcresult \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Publish combined coverage check run
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const path = require("node:path");

            const escapeCell = value => String(value ?? "").replace(/\|/g, "\\|");
            const toNumber = value => Number(value || 0);
            const readArchive = bundle => JSON.parse(execFileSync(
              "xcrun",
              ["xccov", "view", "--archive", "--json", path.join(process.env.GITHUB_WORKSPACE, bundle)],
              { encoding: "utf8", maxBuffer: 32 * 1024 * 1024 }
            ));
            const workspace = process.env.GITHUB_WORKSPACE;
            const reports = [
              {
                name: "macOS",
                archive: readArchive("MacTestResults.xcresult"),
                sourceRoots: [
                  { path: path.join(workspace, "Tests", "TestSupport", "TestHelpers") },
                  { path: path.join(workspace, "Sources", "BreadPartnersCore") }
                ]
              },
              {
                name: "iOS Simulator",
                archive: readArchive("SimulatorTestResults.xcresult"),
                sourceRoots: [
                  { path: path.join(workspace, "Sources", "BreadPartners") },
                  { path: path.join(workspace, "Tests", "UI") },
                  { path: path.join(workspace, "BreadPartnersTestApp", "BreadPartnersTestAppUITests") }
                ]
              }
            ];
            const filesByPath = new Map();

            for (const { archive, sourceRoots } of reports) {
              for (const [filePath, lines] of Object.entries(archive)) {
                const source = sourceRoots.find(({ path: sourcePath }) =>
                  filePath.startsWith(`${sourcePath}${path.sep}`)
                );
                if (!source) continue;

                let file = filesByPath.get(filePath);
                if (!file) {
                  file = {
                    name: path.relative(source.path, filePath),
                    lines: new Map()
                  };
                  filesByPath.set(filePath, file);
                }

                for (const line of lines || []) {
                  if (!line.isExecutable) continue;
                  const wasCovered = file.lines.get(line.line) || false;
                  file.lines.set(line.line, wasCovered || toNumber(line.executionCount) > 0);
                }
              }
            }

            const files = Array.from(filesByPath.values())
              .map(file => ({
                name: file.name,
                coveredLines: Array.from(file.lines.values()).filter(Boolean).length,
                executableLines: file.lines.size,
              }))
              .filter(file => file.executableLines > 0)
              .map(file => ({
                ...file,
                lineCoverage: file.coveredLines / file.executableLines
              }))
              .sort((left, right) => left.lineCoverage - right.lineCoverage);

            if (files.length === 0) {
              const reportNames = reports.map(({ name }) => name).join(", ");
              throw new Error(`No source files found in coverage archives: ${reportNames}`);
            }

            const percent = value => `${(value * 100).toFixed(2)}%`;
            const coveredLines = files.reduce((total, file) => total + file.coveredLines, 0);
            const executableLines = files.reduce((total, file) => total + file.executableLines, 0);
            const lineCoverage = coveredLines / executableLines;
            const rows = files.map(file =>
              `| ${escapeCell(file.name)} | ${percent(file.lineCoverage)} | ${file.coveredLines} / ${file.executableLines} |`
            );
            const text = [
              "| Metric | Value |",
              "| --- | ---: |",
              `| Line Coverage | **${percent(lineCoverage)}** |`,
              `| Covered Lines | ${coveredLines} |`,
              `| Executable Lines | ${executableLines} |`,
              `| Files in Report | ${files.length} |`,
              `| Workflow Run | ${context.runId} |`,
              `| Commit | ${context.sha.slice(0, 7)} |`,
              "",
              "### Lowest Coverage Files",
              "| File | Coverage | Covered / Executable |",
              "| --- | ---: | ---: |",
              ...rows,
              "",
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage (Combined)",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Combined Coverage",
                summary: `Line coverage: **${percent(lineCoverage)}**`,
                text
              }
            });

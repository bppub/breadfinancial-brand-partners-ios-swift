name: CI

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}-ci-pipeline
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Format, lint, and build
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install swift-format and SwiftLint
        run: brew install swift-format swiftlint

      # Keep these checks first: failures stop the job before build/test work.
      - name: Check Swift formatting
        run: Scripts/format.sh --check

      - name: Run SwiftLint
        run: Scripts/lint.sh

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run BreadPartnersTestSupport Tests
        run: |
          xcodebuild test \
            -scheme BreadPartnersTestSupportTests \
            -destination 'platform=macOS' \
            -resultBundlePath TestSupportResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run BreadPartnersCore Tests
        run: |
          xcodebuild test \
            -scheme BreadPartnersCoreTests \
            -destination 'platform=macOS' \
            -resultBundlePath CoreTestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run BreadPartners Tests
        run: |
          xcodebuild test \
            -scheme BreadPartnersTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath iOSTestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Publish combined coverage check run
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const path = require("node:path");

            const escapeCell = value => String(value ?? "").replace(/\|/g, "\\|");
            const toNumber = value => Number(value || 0);
            const readReport = bundle => JSON.parse(execFileSync(
              "xcrun",
              ["xccov", "view", "--report", "--json", path.join(process.env.GITHUB_WORKSPACE, bundle)],
              { encoding: "utf8" }
            ));
            const workspace = process.env.GITHUB_WORKSPACE;
            const reports = [
              {
                name: "TestSupport",
                report: readReport("TestSupportResults.xcresult"),
                sourceRoot: path.join(workspace, "Tests", "TestSupport"),
                excludedRoot: path.join(workspace, "Tests", "TestSupport", "Tests")
              },
              {
                name: "Core",
                report: readReport("CoreTestResults.xcresult"),
                sourceRoot: path.join(workspace, "Sources", "BreadPartnersCore")
              },
              {
                name: "iOS",
                report: readReport("iOSTestResults.xcresult"),
                sourceRoot: path.join(workspace, "Sources", "BreadPartners")
              }
            ];
            const filesByPath = new Map();

            for (const { report, sourceRoot, excludedRoot } of reports) {
              const sourcePrefix = `${sourceRoot}${path.sep}`;
              const excludedPrefix = excludedRoot ? `${excludedRoot}${path.sep}` : null;
              for (const target of report.targets || []) {
                for (const file of target.files || []) {
                  const filePath = String(file.path || "");
                  if (!filePath.startsWith(sourcePrefix)) continue;
                  if (excludedPrefix && filePath.startsWith(excludedPrefix)) continue;
                  const relativePath = path.relative(sourceRoot, filePath);

                  if (filesByPath.has(filePath)) {
                    throw new Error(`Source file was reported by more than one owning test run: ${filePath}`);
                  }
                  filesByPath.set(filePath, {
                    name: relativePath,
                    coveredLines: toNumber(file.coveredLines),
                    executableLines: toNumber(file.executableLines)
                  });
                }
              }
            }

            const files = Array.from(filesByPath.values())
              .filter(file => file.executableLines > 0)
              .map(file => ({
                ...file,
                lineCoverage: file.coveredLines / file.executableLines
              }))
              .sort((left, right) => left.lineCoverage - right.lineCoverage);

            if (files.length === 0) {
              const targetNames = reports
                .flatMap(({ report }) => report.targets || [])
                .map(target => target.name)
                .join(", ");
              throw new Error(`No package source files found. Coverage targets: ${targetNames}`);
            }

            const percent = value => `${(value * 100).toFixed(2)}%`;
            const coveredLines = files.reduce((total, file) => total + file.coveredLines, 0);
            const executableLines = files.reduce((total, file) => total + file.executableLines, 0);
            const lineCoverage = coveredLines / executableLines;
            const rows = files.map(file =>
              `| ${escapeCell(file.name)} | ${percent(file.lineCoverage)} | ${file.coveredLines} / ${file.executableLines} |`
            );
            const text = [
              "| Metric | Value |",
              "| --- | ---: |",
              `| Line Coverage | **${percent(lineCoverage)}** |`,
              `| Covered Lines | ${coveredLines} |`,
              `| Executable Lines | ${executableLines} |`,
              `| Files in Report | ${files.length} |`,
              "| Test Runs Combined | TestSupport + Core + iOS |",
              `| Workflow Run | ${context.runId} |`,
              `| Commit | ${context.sha.slice(0, 7)} |`,
              "",
              "### Lowest Coverage Files",
              "| File | Coverage | Covered / Executable |",
              "| --- | ---: | ---: |",
              ...rows,
              "",
              "Source: `TestSupportResults.xcresult` + `CoreTestResults.xcresult` + `iOSTestResults.xcresult`"
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage (Combined)",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Combined Coverage",
                summary: `Line coverage: **${percent(lineCoverage)}**`,
                text
              }
            });

      - name: Verify Build for iOS
        run: |
          xcodebuild \
            -scheme BreadPartners \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -verbose \
            CODE_SIGNING_ALLOWED=NO \
            build

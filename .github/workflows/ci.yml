name: CI

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}-ci-pipeline
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Format, lint, and build
    runs-on: macos-26
    env:
      SOURCE_PACKAGES_DIR: .spm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install swift-format and SwiftLint
        run: brew install swift-format swiftlint

      # Keep these checks first: failures stop the job before build/test work.
      - name: Check Swift formatting
        run: Scripts/format.sh --check

      - name: Run SwiftLint
        run: Scripts/lint.sh

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run BreadPartnersTestSupport Tests
        run: |
          xcodebuild test \
            -scheme BreadPartnersTestSupportTests \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resultBundlePath TestSupportResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run BreadPartnersCore Tests
        run: |
          xcodebuild test \
            -scheme BreadPartnersCoreTests \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resultBundlePath CoreTestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run BreadPartners Tests
        run: |
          xcodebuild test \
            -scheme BreadPartnersTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resultBundlePath iOSTestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      # Coverage is filtered to the MockServer sources when published, so it can't overlap the iOS run's Sources/BreadPartners.
      - name: Run BreadPartnersTestApp UI Tests
        run: |
          xcodebuild test \
            -project BreadPartnersTestApp/BreadPartnersTestApp.xcodeproj \
            -scheme BreadPartnersTestAppUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -parallel-testing-enabled NO \
            -resultBundlePath UITestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      # Runs after failures too so the PR shows which test run broke.
      - name: Publish combined coverage check run
        if: ${{ !cancelled() }}
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");

            const escapeCell = value => String(value ?? "").replace(/\|/g, "\\|").replace(/\r?\n/g, " ");
            const toNumber = value => Number(value || 0);
            const workspace = process.env.GITHUB_WORKSPACE;
            const bundlePath = bundle => path.join(workspace, bundle);
            const xcrunJSON = args => JSON.parse(execFileSync("xcrun", args, { encoding: "utf8" }));
            const readBundle = (bundle, buildArgs, fallback) => fs.existsSync(bundlePath(bundle))
              ? xcrunJSON(buildArgs(bundlePath(bundle)))
              : fallback;
            const readReport = bundle => readBundle(
              bundle,
              file => ["xccov", "view", "--report", "--json", file],
              { targets: [] }
            );
            const readTests = bundle => readBundle(
              bundle,
              file => ["xcresulttool", "get", "test-results", "summary", "--path", file, "--compact"],
              null
            );
            const testSupportRoot = path.join(workspace, "Tests", "TestSupport");
            const mockServerRoot = path.join(
              workspace, "BreadPartnersTestApp", "BreadPartnersTestAppUITests", "TestHelper", "MockServer"
            );
            // Runs without a sourceRoot contribute test results only, not coverage.
            const runs = [
              {
                name: "TestSupport",
                bundle: "TestSupportResults.xcresult",
                sourceRoot: testSupportRoot,
                excludedRoot: path.join(testSupportRoot, "Tests")
              },
              {
                name: "Core",
                bundle: "CoreTestResults.xcresult",
                sourceRoot: path.join(workspace, "Sources", "BreadPartnersCore")
              },
              {
                name: "iOS",
                bundle: "iOSTestResults.xcresult",
                sourceRoot: path.join(workspace, "Sources", "BreadPartners")
              },
              {
                name: "Integration",
                bundle: "UITestResults.xcresult",
                sourceRoot: mockServerRoot,
                excludedRoot: path.join(mockServerRoot, "Test")
              }
            ];
            const coverageRuns = runs.filter(run => run.sourceRoot);
            const filesByPath = new Map();
            const ownerByPath = new Map();

            for (const { bundle, sourceRoot, excludedRoot } of coverageRuns) {
              const report = readReport(bundle);
              const sourcePrefix = `${sourceRoot}${path.sep}`;
              const excludedPrefix = excludedRoot ? `${excludedRoot}${path.sep}` : null;
              for (const target of report.targets || []) {
                for (const file of target.files || []) {
                  const filePath = String(file.path || "");
                  if (!filePath.startsWith(sourcePrefix)) continue;
                  if (excludedPrefix && filePath.startsWith(excludedPrefix)) continue;
                  const relativePath = path.relative(sourceRoot, filePath);

                  if (filesByPath.has(filePath) && ownerByPath.get(filePath) !== bundle) {
                    throw new Error(`Source file was reported by more than one owning test run: ${filePath}`);
                  }
                  // A file compiled into several targets of one run is reported once per target.
                  if (filesByPath.get(filePath)?.coveredLines >= toNumber(file.coveredLines)) continue;
                  ownerByPath.set(filePath, bundle);
                  filesByPath.set(filePath, {
                    name: relativePath,
                    coveredLines: toNumber(file.coveredLines),
                    executableLines: toNumber(file.executableLines)
                  });
                }
              }
            }

            const files = Array.from(filesByPath.values())
              .filter(file => file.executableLines > 0)
              .map(file => ({
                ...file,
                lineCoverage: file.coveredLines / file.executableLines
              }))
              .sort((left, right) => left.lineCoverage - right.lineCoverage);

            const percent = value => `${(value * 100).toFixed(2)}%`;
            const coveredLines = files.reduce((total, file) => total + file.coveredLines, 0);
            const executableLines = files.reduce((total, file) => total + file.executableLines, 0);
            const hasCoverage = executableLines > 0;
            const lineCoverage = hasCoverage ? coveredLines / executableLines : 0;
            const coverageLabel = hasCoverage ? percent(lineCoverage) : "n/a";
            const rows = files.map(file =>
              `| ${escapeCell(file.name)} | ${percent(file.lineCoverage)} | ${file.coveredLines} / ${file.executableLines} |`
            );

            const testRuns = runs.map(({ name, bundle }) => ({ name, summary: readTests(bundle) }));
            const testRows = testRuns.map(({ name, summary }) => summary
              ? `| ${name} | ${summary.result} | ${toNumber(summary.passedTests)} | ${toNumber(summary.failedTests)} | ${toNumber(summary.skippedTests)} |`
              : `| ${name} | Not run | – | – | – |`);
            const failures = testRuns.flatMap(({ name, summary }) =>
              (summary?.testFailures ?? []).map(failure =>
                `- **${name}** \`${escapeCell(failure.testIdentifierString ?? failure.testName)}\`: ${escapeCell(failure.failureText)}`));
            const anyFailed = testRuns.some(({ summary }) => !summary || toNumber(summary.failedTests) > 0);

            const text = [
              "| Metric | Value |",
              "| --- | ---: |",
              `| Line Coverage | **${coverageLabel}** |`,
              `| Covered Lines | ${coveredLines} |`,
              `| Executable Lines | ${executableLines} |`,
              `| Files in Report | ${files.length} |`,
              `| Coverage Runs Combined | ${coverageRuns.map(run => run.name).join(" + ")} |`,
              `| Workflow Run | ${context.runId} |`,
              `| Commit | ${context.sha.slice(0, 7)} |`,
              "",
              "### Test Results",
              "| Run | Result | Passed | Failed | Skipped |",
              "| --- | --- | ---: | ---: | ---: |",
              ...testRows,
              ...(failures.length ? ["", "#### Failures", ...failures] : []),
              "",
              "### Lowest Coverage Files",
              "| File | Coverage | Covered / Executable |",
              "| --- | ---: | ---: |",
              ...rows,
              "",
              `Source: ${runs.map(run => `\`${run.bundle}\``).join(" + ")}`
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage (Combined)",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: anyFailed ? "failure" : "success",
              output: {
                title: anyFailed ? "Tests failed" : "Combined Coverage",
                summary: `Line coverage: **${coverageLabel}**`,
                text
              }
            });

      - name: Verify Build for iOS
        run: |
          xcodebuild \
            -scheme BreadPartners \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -verbose \
            CODE_SIGNING_ALLOWED=NO \
            build
